<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《剑来》· 剑气长城 动态场景演示</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #060911;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Songti SC", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .theater {
      position: relative;
      width: 1200px;
      max-width: 95vw;
      height: 675px;
      max-height: 80vh;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 179, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.2);
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 顶部书法标题浮层 */
    .title-banner {
      position: absolute;
      top: 28px;
      left: 36px;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 4px 15px rgba(0,0,0,0.85);
    }
    .title-banner h1 {
      font-size: 38px;
      letter-spacing: 8px;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 0%, #ffe082 70%, #ffb300 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title-banner p {
      margin-top: 6px;
      font-size: 14px;
      letter-spacing: 4px;
      color: #cfd8dc;
      opacity: 0.9;
    }

    /* 底部旁白诗句 */
    .poem-box {
      position: absolute;
      bottom: 28px;
      left: 36px;
      max-width: 520px;
      background: rgba(10, 15, 25, 0.65);
      backdrop-filter: blur(8px);
      padding: 14px 22px;
      border-radius: 8px;
      border-left: 3px solid #ffb300;
      z-index: 10;
      pointer-events: none;
    }
    .poem-box p {
      font-size: 15px;
      line-height: 1.8;
      letter-spacing: 2px;
      color: #eceff1;
    }
    .poem-box span {
      color: #ffd54f;
      font-weight: bold;
    }

    /* 控制栏 */
    .controls {
      position: absolute;
      bottom: 28px;
      right: 36px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .btn {
      background: rgba(20, 25, 38, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.35);
      color: #ffd54f;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(255, 215, 0, 0.2);
      border-color: #ffd54f;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 179, 0, 0.3);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-record {
      background: linear-gradient(135deg, rgba(230, 81, 0, 0.85), rgba(191, 54, 12, 0.85));
      color: #fff;
      border-color: #ff9800;
    }
    .btn-record:hover {
      background: linear-gradient(135deg, #f57c00, #d84315);
      box-shadow: 0 4px 20px rgba(245, 124, 0, 0.5);
    }

    /* 录制进度指示 */
    .record-indicator {
      display: none;
      position: absolute;
      top: 28px;
      right: 36px;
      background: rgba(211, 47, 47, 0.85);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 1px;
      align-items: center;
      gap: 6px;
      z-index: 15;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="theater" id="theater">
    <!-- 标题 -->
    <div class="title-banner">
      <h1>剑 来</h1>
      <p>落魄山头草鞋客 · 剑气长城第一人</p>
    </div>

    <!-- 诗句与旁白 -->
    <div class="poem-box">
      <p>“天不生我陈平安，万古剑道如长夜。”</p>
      <p style="font-size: 13px; color: #b0bec5; margin-top: 4px;">草鞋背剑，养剑葫芦。天地之间，唯有一声：<span>“剑来！”</span></p>
    </div>

    <!-- 录制提示条 -->
    <div class="record-indicator" id="rec-indicator">
      <div class="dot"></div> 正在录制 5 秒视频切片...
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
      <button class="btn" id="sound-btn">🔊 开启剑鸣风啸音效</button>
      <button class="btn btn-record" id="record-btn">🎬 导出实机视频 (MP4/WebM)</button>
    </div>

    <!-- 主渲染画布 -->
    <canvas id="viewCanvas" width="1920" height="1080"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1920;
    const HEIGHT = 1080;

    // 加载剑来背景图
    const bgImg = new Image();
    bgImg.src = 'jian_lai_bg.jpg';

    // 飞剑光线粒子系统
    const flyingSwords = [];
    const swordColors = [
      { core: '#ffffff', glow: '#ffb300', trail: 'rgba(255, 179, 0, ' },
      { core: '#ffffff', glow: '#00e5ff', trail: 'rgba(0, 229, 255, ' },
      { core: '#fff9c4', glow: '#ff8f00', trail: 'rgba(255, 143, 0, ' },
      { core: '#e0f7fa', glow: '#00b0ff', trail: 'rgba(0, 176, 255, ' }
    ];

    function spawnSword() {
      // 飞剑从右上/上方苍穹向左下/前方激射
      const startX = 600 + Math.random() * 1400;
      const startY = -80 + Math.random() * 200;
      const angle = (Math.PI * 0.72) + (Math.random() - 0.5) * 0.18;
      const speed = 26 + Math.random() * 22;
      const length = 120 + Math.random() * 160;
      const color = swordColors[Math.floor(Math.random() * swordColors.length)];

      flyingSwords.push({
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        length: length,
        color: color,
        width: 2.5 + Math.random() * 3,
        alpha: 0,
        maxAlpha: 0.85 + Math.random() * 0.15,
        life: 0,
        maxLife: 60 + Math.random() * 40
      });
    }

    // 初始化一些剑气
    for (let i = 0; i < 12; i++) spawnSword();

    // 空中灵光尘埃粒子 (剑意微粒)
    const embers = [];
    for (let i = 0; i < 80; i++) {
      embers.push({
        x: Math.random() * WIDTH,
        y: Math.random() * HEIGHT,
        vx: -0.5 - Math.random() * 1.5,
        vy: -0.3 + (Math.random() - 0.5) * 0.6,
        size: 1 + Math.random() * 2.5,
        alpha: 0.2 + Math.random() * 0.7,
        pulse: Math.random() * Math.PI * 2,
        color: Math.random() > 0.5 ? '#ffe082' : '#80deea'
      });
    }

    // 飘拂云雾层 (多层透明流动云海)
    const clouds = [
      { x: 0, y: 550, speed: 0.4, alpha: 0.25 },
      { x: 500, y: 700, speed: 0.7, alpha: 0.35 },
      { x: -300, y: 850, speed: 0.5, alpha: 0.3 }
    ];

    // 镜头运镜参数 (Cinematic Ken Burns 缓动)
    let time = 0;
    let cameraScale = 1.0;
    let cameraX = 0;
    let cameraY = 0;

    // 音频合成器 (Web Audio API 模拟天地剑鸣与山风)
    let audioCtx = null;
    let soundEnabled = false;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSwordHum() {
      if (!audioCtx || !soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'sawtooth';
        const startFreq = 800 + Math.random() * 600;
        osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 1.2);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
        filter.Q.setValueAtTime(8, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.3);
      } catch (e) {}
    }

    // 渲染主循环
    function render() {
      time += 0.016;

      // 电影级呼吸运镜：平滑缩放与视角推移
      cameraScale = 1.0 + Math.sin(time * 0.15) * 0.045;
      cameraX = Math.sin(time * 0.12) * 20;
      cameraY = Math.cos(time * 0.18) * 12;

      ctx.save();
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // 居中变换
      ctx.translate(WIDTH / 2 + cameraX, HEIGHT / 2 + cameraY);
      ctx.scale(cameraScale, cameraScale);
      ctx.translate(-WIDTH / 2, -HEIGHT / 2);

      // 1. 绘制背景原画
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, WIDTH, HEIGHT);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      // 2. 飞剑如雨动效
      if (Math.random() < 0.22) {
        spawnSword();
        if (Math.random() < 0.3) playSwordHum();
      }

      ctx.save();
      for (let i = flyingSwords.length - 1; i >= 0; i--) {
        const s = flyingSwords[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life++;

        // 透明度淡入淡出
        if (s.life < 10) {
          s.alpha = (s.life / 10) * s.maxAlpha;
        } else if (s.life > s.maxLife - 15) {
          s.alpha = ((s.maxLife - s.life) / 15) * s.maxAlpha;
        } else {
          s.alpha = s.maxAlpha;
        }

        // 飞剑尾迹渐变
        const tailX = s.x - (s.vx / Math.hypot(s.vx, s.vy)) * s.length;
        const tailY = s.y - (s.vy / Math.hypot(s.vx, s.vy)) * s.length;

        const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.15, s.color.glow);
        grad.addColorStop(1, s.color.trail + '0)');

        ctx.strokeStyle = grad;
        ctx.lineWidth = s.width;
        ctx.lineCap = 'round';
        ctx.globalAlpha = s.alpha;

        // 绘制尾芒
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        // 剑尖亮核光晕
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = s.color.glow;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.width * 1.2, 0, Math.PI * 2);
        ctx.fill();

        // 移除超出视口或生命结束的飞剑
        if (s.life >= s.maxLife || s.x < -100 || s.y > HEIGHT + 100) {
          flyingSwords.splice(i, 1);
        }
      }
      ctx.restore();

      // 3. 金色与冰青色剑意光尘
      ctx.save();
      embers.forEach(e => {
        e.x += e.vx;
        e.y += e.vy;
        e.pulse += 0.05;
        if (e.x < 0) e.x = WIDTH + 10;
        if (e.y < 0) e.y = HEIGHT + 10;
        if (e.y > HEIGHT) e.y = 0;

        const currentAlpha = e.alpha * (0.6 + Math.sin(e.pulse) * 0.4);
        ctx.fillStyle = e.color;
        ctx.globalAlpha = currentAlpha;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();

      // 4. 远方滚滚云海流动光效叠加
      ctx.save();
      const cloudGrad = ctx.createLinearGradient(0, 480, 0, 850);
      cloudGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      cloudGrad.addColorStop(0.5, 'rgba(215, 230, 245, ' + (0.08 + Math.sin(time * 0.8) * 0.03) + ')');
      cloudGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = cloudGrad;
      ctx.fillRect(0, 450, WIDTH, 400);
      ctx.restore();

      // 5. 电影暗角 (Vignette)
      const vignette = ctx.createRadialGradient(
        WIDTH / 2, HEIGHT / 2, WIDTH * 0.35,
        WIDTH / 2, HEIGHT / 2, WIDTH * 0.72
      );
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(4, 7, 15, 0.65)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.restore();

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    // 音效开关
    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 剑鸣已开启 (回响中)' : '🔇 开启剑鸣风啸音效';
      soundBtn.style.color = soundEnabled ? '#69f0ae' : '#ffd54f';
    });

    // 60FPS 实机视频录制与下载
    const recordBtn = document.getElementById('record-btn');
    const recIndicator = document.getElementById('rec-indicator');

    recordBtn.addEventListener('click', () => {
      if (!window.MediaRecorder) {
        alert('当前浏览器不支持 MediaRecorder 视频录制 API');
        return;
      }

      recordBtn.disabled = true;
      recordBtn.textContent = '⏳ 正在录制视频 (5秒)...';
      recIndicator.style.display = 'flex';

      const stream = canvas.captureStream(60);
      let options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      const recorder = new MediaRecorder(stream, options);
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '剑来_剑气长城_实机动态场景.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        recIndicator.style.display = 'none';
        recordBtn.disabled = false;
        recordBtn.textContent = '🎬 录制完成！点击可再次导出';
      };

      recorder.start();
      // 录制 5 秒后自动停止并弹出保存
      setTimeout(() => {
        recorder.stop();
      }, 5000);
    });
  </script>
</body>
</html>
